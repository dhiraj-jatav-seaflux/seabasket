services:
  postgres:
    image: postgres:latest
    container_name: postgres-etst
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup.sql:/backup.sql
      
volumes:
  postgres_data:


# $ Run the below command to import the dump
# docker exec -t postgres psql -U recursing_fermi -d uknowme_db -f /backup.sql